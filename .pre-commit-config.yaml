# Pre-commit hooks for investment-agent
# Install: poetry run pre-commit install
# Run manually: poetry run pre-commit run --all-files

repos:
  # Ruff - Fast Python linter and formatter (replaces flake8, isort, black)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      # Linter - auto-fixes issues where possible
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      # Formatter - consistent code style
      - id: ruff-format
        types_or: [python, pyi]

  # Basic file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: '\.md$'
      - id: end-of-file-fixer
        exclude: '\.md$'
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: '^poetry\.lock$'
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: '^\.env\.example$|^scripts/portfolio_manager\.py$'

  # Type checking (optional - runs on commit but doesn't block)
  # Uncomment if you want strict type checking on every commit
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.13.0
  #   hooks:
  #     - id: mypy
  #       additional_dependencies: [types-requests]
  #       args: [--ignore-missing-imports]

  # Snyk advisory security scan.
  # Silently skips when snyk is not installed or not authenticated, and treats a
  # depleted plan/test-limit ("licensing") failure as a skip — never blocks a
  # commit. HIGH/CRITICAL findings are printed as remediation notes.
  # Install: brew install snyk  or  npm install -g snyk   Authenticate: snyk auth
  #
  # Scoped to dependency-manifest changes: Snyk scans poetry.lock/pyproject.toml,
  # which is all that affects the result, so running on every commit would only
  # burn the monthly test allowance. CI (pip-audit in security.yml) still scans
  # dependencies on every push regardless.
  - repo: local
    hooks:
      - id: snyk
        name: Snyk (advisory HIGH/CRITICAL scan)
        language: script
        entry: scripts/snyk_check.sh
        pass_filenames: false
        files: '^(poetry\.lock|pyproject\.toml)$'
        verbose: true
        stages: [pre-commit]
