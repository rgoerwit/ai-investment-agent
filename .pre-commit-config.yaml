# Pre-commit hooks for investment-agent
# Install: poetry run pre-commit install
# Run manually: poetry run pre-commit run --all-files

repos:
  # Ruff - Fast Python linter and formatter (replaces flake8, isort, black)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in lockstep with the `ruff` pin in pyproject.toml's dev group: this
    # hook is what gates commits, so a drift between the two means local runs
    # and the gate can disagree about formatting.
    rev: v0.16.2
    hooks:
      # Linter - auto-fixes issues where possible
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      # Formatter - consistent code style
      - id: ruff-format
        types_or: [python, pyi]

  # Basic file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: '\.md$'
      - id: end-of-file-fixer
        exclude: '\.md$'
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: '^poetry\.lock$'
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: '^\.env\.example$|^scripts/portfolio_manager\.py$'

  # Type checking (optional - runs on commit but doesn't block)
  # Uncomment if you want strict type checking on every commit
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.13.0
  #   hooks:
  #     - id: mypy
  #       additional_dependencies: [types-requests]
  #       args: [--ignore-missing-imports]

  # Snyk security scans (MEDIUM+). Both hooks skip cleanly when snyk is missing,
  # unauthenticated, quota-limited, or errors operationally — the "only activate
  # when Snyk is available" contract. See scripts/snyk_check.sh.
  # Install: brew install snyk  or  npm install -g snyk   Authenticate: snyk auth
  #
  #  • snyk-deps           BLOCKS the commit (exit 1) on a MEDIUM+ dependency
  #                        finding, so pre-commit reports "Failed" instead of a
  #                        misleading "Passed". Override with SNYK_ADVISORY=1.
  #                        Scoped to dependency manifests (all that affects SCA).
  #                        CI (pip-audit in security.yml) also scans deps per push.
  #  • snyk-container-base Advisory REVIEW REQUIRED (never blocks) for the base
  #                        image. Scans the base TAG only (fast, no build/daemon);
  #                        the BUILT image is scanned in CI (security.yml), which
  #                        is where `apt-get upgrade -y` remediation is verifiable.
  - repo: local
    hooks:
      - id: snyk-deps
        name: Snyk dependency scan (medium+, blocking)
        language: script
        entry: scripts/snyk_check.sh
        args: ['deps']
        pass_filenames: false
        files: '^(poetry\.lock|pyproject\.toml)$'
        verbose: true
        stages: [pre-commit]
      - id: snyk-container-base
        name: Snyk base-image scan (medium+, review-required)
        language: script
        entry: scripts/snyk_check.sh
        args: ['container-base']
        pass_filenames: false
        files: '^Dockerfile$'
        verbose: true
        stages: [pre-commit]
      # A tracked file must not depend on a gitignored INPUT: a cloner has none of
      # it, so the reference is broken on arrival and invisible in the diff.
      # Obtainable paths (results/, runtime/, .env) are fine; anything else needs
      # the marker `tracked-deps-ok` on the line, as a machine-checkable caveat.
      - id: tracked-deps
        name: Tracked files must not depend on unobtainable paths
        language: script
        entry: scripts/check_tracked_deps.sh
        # Every tracked Markdown file, with no exclusions. Obtainability applies to
        # the agent layer too: a rule whose `Full history:` pointer resolves into the
        # operator-only notes directory is exactly the defect this catches.
        files: '\.md$'
        stages: [pre-commit]
      # Agent metadata is not human-facing documentation. This is a LAYERING test and
      # deliberately separate from tracked-deps above: once the agent directory becomes
      # tracked, obtainability stops objecting to citations of it while this still does.
      - id: doc-layering
        name: Documentation must not cite agent metadata
        language: script
        entry: scripts/check_doc_layering.sh
        files: '\.md$'
        # Mirror of AGENT_DIRS in scripts/check_doc_layering.sh, which is the
        # authority and self-skips these regardless of what this line says.
        exclude: '^\.(claude|agents|codex|gemini|cursor|windsurf|aider|cline|continue|roo|junie|amp)/'
        stages: [pre-commit]
