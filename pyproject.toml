[tool.poetry]
name = "multi-agent-trading-system"
version = "3.1.0"
description = "A multi-agent international equity research system using LangGraph"
authors = ["Trading System Team <team@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
# Python version compatibility
python = ">=3.12,<3.13"

# Core LangChain & LangGraph
langchain = "1.3.14"
langchain-core = "1.5.3"
# CRITICAL FIX: Required for Tavily and other tools
langchain-community = ">=0.4.0,<1.0.0"
# Primary LLM: Google Gemini
langchain-google-genai = "4.3.2"
# Transitive of langchain-google-genai (nothing in src/ imports it directly).
# Moved off the old <2.0.0 cap in Aug 2026: 2.0.0's only breaking changes are
# Interactions-only — upstream states GenerateContent is unaffected — and the two
# behaviours this repo couples to (service_tier enums, optional aiohttp) landed
# in 1.70.0 / 1.65.0, below the 1.75.0 we were already on. Exact, not a range:
# a range resolves to the newest release, which was 3 days old at pin time.
google-genai = "2.17.0"
# OPTIONAL: OpenAI for consultant node (cross-validation)
# The consultant node uses OpenAI to provide independent review of Gemini analysis
langchain-openai = "1.4.2"
# Writer LLM: Anthropic Claude (falls back to Gemini if CLAUDE_KEY not set)
langchain-anthropic = "1.5.4"
langgraph = "1.2.10"
langgraph-checkpoint = "4.2.0"

# LangSmith
langsmith = "0.10.17"

# Tavily
langchain-tavily = ">=0.2.0,<1.0.0"
tavily-python = "0.7.27"

# Financial data
yfinance = "1.5.2"  # yfinance 1.0 released Dec 2025
# ADDED: yahooquery for multi-source fallback
yahooquery = "^2.3.0"
finnhub-python = "^2.4.20"
stockstats = "^0.6.2"
pandas = "3.0.5"

# Vector database
chromadb = "^1.3.0"

# HTTP and async
aiohttp = ">=3.10.0,<4.0.0"
requests = ">=2.32.0,<3.0.0"
httpx = ">=0.27.0,<1.0.0"

# Utilities
rich = "^15.0.0"
python-dotenv = ">=1.0.0,<2.0.0"
structlog = "26.1.0"
tenacity = ">=9.0.0,<10.0.0"
beautifulsoup4 = ">=4.12.0,<5.0.0"
# Transitive of the Google auth chain (google-auth -> pyasn1-modules -> pyasn1).
# NOT redundant despite pyasn1-modules already flooring at >=0.6.1: pyasn1 0.6.1
# carries five CVEs, and CVE-2026-59884/59885/59886 are fixed ONLY in 0.6.4. Do
# not remove on the grounds that the resolver reaches 0.6.4 unaided today.
pyasn1 = "0.6.4"
# Clears GHSA-fwg2-594c-jp42 / GHSA-fp3f-mc75-235c (excessive iteration and
# excessive memory allocation). Reachable, not theoretical: the Forensic Auditor
# parses externally retrieved PDFs.
pypdf = "6.15.0"

# Scientific computing
numpy = "2.5.1"
pydantic = ">=2.10.0,<3.0.0"
pydantic-settings = "2.15.0"

# Optional integrations
opentelemetry-api = {version = "1.44.0", optional = true}
opentelemetry-sdk = {version = "1.44.0", optional = true}
# Exact, not a range: the floor tracks the fixed release. 2.6.3 fixes
# GHSA-38jv-5279-wg99; 2.7.0 fixes GHSA-qccp-gfcp-xxvc and GHSA-mf9v-mfxr-j63j.
# Scanners read poetry.lock, not this constraint, so a low range here stays
# invisible to CI until some future re-resolve lands on a vulnerable version.
urllib3 = "2.7.0"
matplotlib = "3.11.1"
# Exact: transitive of mcp / sse-starlette, declared here only to carry this
# floor. starlette 1.0.0 carries ten advisories and the fixes land across four
# releases — 1.0.1, 1.1.0, 1.3.0 and 1.3.1 — so the old ">=1.0.1" admitted
# vulnerable 1.0.1-1.2.x. Raise in lockstep if mcp ever floors above 1.3.1;
# today it needs only >=0.27, so an exact pin cannot conflict, but a future
# upstream bump will fail resolution here rather than silently resolve.
starlette = "1.3.1"
seaborn = "^0.13.2"
langfuse = "4.14.3"
openpyxl = "^3.1.5"
xlrd = "^2.0.2"
lxml = "^6.1.0"
ddgs = "^9.14.4"
edinet-tools = {version = ">=0.6.0,<1.0.0", optional = true}
ibind = "0.1.24"
pycryptodome = "^3.21"  # Required by ibind OAuth 1.0a
flask = "^3.1.3"
markdown = "3.10.3"
nh3 = "^0.3.1"
langchain-text-splitters = "1.1.2"
# Held at 1.x deliberately (audited Aug 2026), not merely for major-safety:
# v2 swaps httpx for httpx2 and renames wire fields to snake_case, and three of
# the five hits in src/mcp/ fail SILENTLY. See docs/MCP.md "Why mcp stays on 1.x".
mcp = ">=1.26.0,<2.0.0"
click = "^8.3.3"
openai = "2.53.0"
anthropic = "0.121.0"
# Remediates CVE-2026-69247 (PKCS#7 EnvelopedData decryption timing attack).
# Transitive only (google-auth, pyjwt), both of which floor far below, so this
# pin is the enforcement point.
cryptography = "50.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
pytest-asyncio = "^1.3.0"
pytest-mock = ">=3.14.0,<4.0.0"
ruff = "0.16.2"
mypy = "2.3.0"
ast-serialize = "0.8.0"
librt = "0.15.0"
pre-commit = "4.6.1"
ipython = "9.16.1"
pytest-env = "1.7.0"
pytest-socket = ">=0.8.0,<0.9.0"

[tool.poetry.extras]
observability = ["opentelemetry-api", "opentelemetry-sdk"]
consultant = ["langchain-openai"]  # Enable external consultant for cross-validation
writer = ["langchain-anthropic"]  # Claude-based article writer
filings = ["edinet-tools"]  # Japan EDINET filing API

[tool.poetry.scripts]
ibkr-dashboard = "src.web.ibkr_dashboard.app:main"
ibkr-dashboard-worker = "src.web.ibkr_dashboard.worker:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "E701",  # Multiple statements on one line - used intentionally in dispatch tables
    "E402",  # Module level import not at top - intentional in some files
    "B008",  # Function call in default argument
    "C901",  # Function too complex
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
known-third-party = ["mcp"]

[tool.ruff.lint.per-file-ignores]
# health_check.py imports modules to verify they're installed
"src/health_check.py" = ["F401"]
# Tests often have unused variables for side effects (patches, mocks)
# F401: Imports for availability checks (try/except ImportError pattern)
"tests/*.py" = ["F841", "F401"]
"tests/**/*.py" = ["F841", "F401"]
# Examples may have demonstration code
"examples/*.py" = ["B018"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
local_partial_types = true
strict_bytes = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

# Comprehensive options moved from pytest.ini
addopts = """
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --durations=10
    --maxfail=5
    -p no:cacheprovider
    --allow-unix-socket
"""

# Register custom markers
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests requiring external services",
    "unit: marks tests as unit tests",
    "benchmark: marks tests as performance benchmarks",
    "memory: marks tests that require memory/ChromaDB",
    "llm: marks tests that require LLM connectivity",
    "api: marks tests that require external API access",
    "security: marks tests that must not perform network or external side effects",
    "semantic: marks L3 semantic-judge tests requiring LLM (excluded from default run)",
    "asyncio: marks tests as asyncio",
]

# Filter out warnings from third-party libraries
filterwarnings = [
    "ignore:The default value of `allowed_objects` will change:langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
    "ignore:Inheritance class AiohttpClientSession from ClientSession is discouraged:DeprecationWarning:google\\.genai\\._api_client",
    # langchain_tavily field shadowing warnings (third-party, cannot fix)
    "ignore:Field name \"output_schema\" in \"TavilyResearch\":UserWarning",
    "ignore:Field name \"stream\" in \"TavilyResearch\":UserWarning",
]

[tool.pytest_env]
ENVIRONMENT = "test"
PYTEST_DISABLE_DOTENV = "true"
LOG_LEVEL = "DEBUG"
ENABLE_MEMORY = "false"
ONLINE_TOOLS = "false"
DEFAULT_TICKER = "TEST"
# Import-time tool registration happens before session fixtures. Public dummy values
# keep collection deterministic without reading an operator's ignored environment file.
GOOGLE_API_KEY = "test-key"
TAVILY_API_KEY = "test-key"
FINNHUB_API_KEY = "test-key"
